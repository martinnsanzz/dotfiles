# btop for the home tab: just CPU and memory, muted colors.
# Only non-default settings are listed; btop fills in the rest.

color_theme = "plain"
theme_background = false        # transparent, like the Ghostty window
rounded_corners = true
graph_symbol = "braille"
update_ms = 2000
save_config_on_exit = false     # keep this file exactly as it is in the repo

# Boxes: CPU and memory only (no network, disks or process list)
shown_boxes = "cpu mem"

# CPU box: one combined graph, no GPU/temps/frequency/watts/battery
cpu_single_graph = true
show_gpu_info = "Off"
check_temp = false
show_coretemp = false
show_cpu_freq = false
show_cpu_watts = false
show_uptime = false
show_battery = false
clock_format = ""

# Memory box: plain bars instead of graphs, no swap or disks
mem_graphs = false
show_swap = false
show_disks = false
show_io_stat = false
