# yazi as the file tree in the top-right pane of a claude tab

[mgr]
ratio = [1, 2, 3]      # parent, current folder, preview of the hovered file
sort_dir_first = true
show_hidden = true

# Enter and clicks go through plugins/open-vim.yazi instead (instant).
# This opener is the fallback for `o` and for yazi outside tmux.
[opener]
edit = [
	{ run = 'nvim %s', block = true, desc = "nvim" },
]
