# Enter opens files in nvim instantly (see plugins/open-nvim.yazi)
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin open-nvim"
desc = "Enter folder or open file in nvim"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin open-nvim"
desc = "Enter folder or open file in nvim"

# q in the Option+e popup closes it instantly (see plugins/quit-popup.yazi)
[[mgr.prepend_keymap]]
on   = "q"
run  = "plugin quit-popup"
desc = "Quit (closes the file popup at once)"
