# tmux config — prefix is the default Ctrl+b

# Shell for new panes
if-shell 'test -x /opt/homebrew/bin/fish' \
	'set -g default-shell /opt/homebrew/bin/fish' \
	'if-shell "test -x /usr/local/bin/fish" "set -g default-shell /usr/local/bin/fish"'

# Colors and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -sg escape-time 10          # no lag after Esc in vim
set -g focus-events on
set -g history-limit 50000

# Mouse: click to focus panes, drag borders to resize, scroll history
set -g mouse on

# Count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Option-key shortcuts (no prefix). Option+? shows them all. ──

# Tabs: Option+1..9 jumps to that tab
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Tabs: new shell tab, new dev tab (project picker), rename, close
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-d display-popup -E -w 60% -h 60% -T " open project " "$HOME/.local/bin/dev --pick"
bind -n M-r command-prompt -I "#W" -p "rename tab:" "rename-window '%%'"
bind -n M-W confirm-before -p "close tab #W? (y/n)" kill-window

# Panes: move with Option+arrows
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Panes: resize with Option+Shift+arrows
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Down  resize-pane -D 3
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Right resize-pane -R 5

# Panes: zoom to full tab (toggle), split, close
bind -n M-z resize-pane -Z
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-w confirm-before -p "close pane? (y/n)" kill-pane

# Scroll back through output without the mouse (q to leave)
bind -n M-u copy-mode -u

# Cheat sheet
bind -n M-? display-popup -E -w 64 -h 32 -T " shortcuts " "less ~/.config/tmux/keys.txt"

# Splits that open in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Copy mode with vim keys (prefix [ to enter, v to select, y to copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Pane borders show what's running in each pane
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Tab bar at the top, transparent so Ghostty's see-through background shows
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#6c7086"
set -g status-left ""
set -g status-right " %H:%M "
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
